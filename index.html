<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrary Live</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

<div class="animated-bg"></div>

<div class="container vh-100 d-flex justify-content-center align-items-center">
<div class="login-box glass-card">

<div class="logo-circle"></div>

<h1 class="main-title">NUTRARY LIVE</h1>
<p class="subtitle">Premium Wellness Streaming</p>

<form id="loginForm">
<input type="email" id="email" class="form-control custom-input mb-3" placeholder="Correo electrónico" required>
<input type="password" id="password" class="form-control custom-input mb-4" placeholder="Contraseña" required>

<button class="btn login-btn w-100" type="submit">INGRESAR</button>
</form>

<div id="status" class="mt-4"></div>

</div>
</div>

<footer class="footer-modern">
<a href="https://instagram.com">Instagram</a>
<a href="https://youtube.com">YouTube</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase/config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
